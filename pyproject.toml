[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-wifi"
version = "1.1.1"
description = "Black Diamond Hub app: Wi-Fi QR codes for guests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.1,<1",
    "qrcode>=7.4",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-wifi"

[project.entry-points."blackdiamondhub.plugins"]
wifi = "wifi.plugin:spec"

[tool.setuptools.packages.find]
include = ["wifi", "wifi.*"]

[tool.setuptools.package-data]
wifi = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]